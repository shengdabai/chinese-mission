name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from the committed lockfile (official registry only)
        run: |
          set -euo pipefail
          for stray in pnpm-lock.yaml yarn.lock bun.lock bun.lockb; do
            if [ -e "$stray" ]; then
              echo "::error::$stray is present; Vercel would install from it instead of the audited package-lock.json"
              exit 1
            fi
          done
          if grep -q 'registry.npmmirror.com' package-lock.json; then
            echo "::error::package-lock.json resolves packages from a mirror; regenerate against registry.npmjs.org"
            exit 1
          fi
          npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit and integration tests (vitest suites, then budgets, quota store, AI path, TTS error body)
        run: npm test
      - name: Production build
        run: npm run build
        env:
          USE_RULE_ENGINE: "true"
